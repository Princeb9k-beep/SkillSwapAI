# SkillSwap AI — DATA TIER (runs on the Redis VPS, 80.190.73.191).
#
#   deploy/setup-data-vps.sh      # ONCE: docker, the 10G mount, ufw, systemd
#   deploy/data-deploy.sh         # every time: pull, tune, up, health-gate
#
# This box already runs Nova Flow's production Redis natively from apt on
# 127.0.0.1 + 10.77.0.1:6379. Nothing here touches it: this Redis is a separate
# container on port 6380, so an eviction storm in one app cannot evict the
# other's keys, and the two have separate passwords.
#
# ── THE BIND ADDRESS IS THE WALL, NOT THE FIREWALL ───────────────────────────
# Both services publish on ${WG_ADDR:-10.77.0.1} — the WireGuard address — and
# never on 0.0.0.0. This is not belt-and-braces, it is the whole security
# boundary. For any non-loopback publish Docker inserts a DNAT rule into the
# nat table's DOCKER chain, and nat/PREROUTING is traversed BEFORE ufw's
# filter/INPUT. So a box whose firewall denies 5432 still accepts the
# connection, `ufw status` reports the port closed while it is open, and
# nothing logs anything. Writing "5432:5432" here would put this database on
# the internet, silently. The ufw rules setup-data-vps.sh adds are defence in
# depth on top of the bind, never instead of it.
#
# 10.77.0.1 only exists once wg0 is up, so a container started before the
# tunnel dies with "cannot assign requested address" — deploy/skillswap-data.service
# carries the ordering that survives a reboot.

services:
  # ── bootstrap: makes the 10 GB ceiling exist, in the YAML ────────────────
  #
  # This used to be a shell script you had to remember to run first. It is here
  # instead so the whole data tier is one `docker compose up -d` over SSH.
  #
  # It does exactly two things, both idempotent:
  #   1. waits for the WireGuard address to exist, because postgres and redis
  #      PUBLISH on it and a container that cannot bind does not retry into
  #      success — it is simply down. Failing here, loudly, with the reason, is
  #      the difference between "the tunnel is down" and "the database is gone".
  #   2. creates and formats the backing image for the pgdata volume, ONCE.
  #
  # It needs `privileged` because mkfs and the loop device are kernel-level
  # operations no unprivileged container can perform. That is a real grant and
  # worth knowing about: it runs for a few seconds at bring-up, exits, and
  # nothing else in this stack is privileged. If you would rather not grant it,
  # deploy/setup-data-vps.sh --filesystem does the same work from the host and
  # this service then finds everything already in place and exits immediately.
  bootstrap:
    image: alpine:3.20
    # host networking so it can SEE wg0. It opens no ports of its own.
    network_mode: host
    privileged: true
    volumes:
      # The parent of the image file, not the file — it may not exist yet.
      - ${PGDATA_IMAGE_DIR:-/srv/skillswap}:/host-data
    environment:
      WG_ADDR: ${WG_ADDR:-10.77.0.1}
      PGDATA_SIZE: ${PGDATA_SIZE:-10G}
      WAIT_SECONDS: ${WG_WAIT_SECONDS:-120}
    command:
      - sh
      - -c
      - |
        set -e
        IMG=/host-data/pgdata.img

        echo "bootstrap: waiting up to $${WAIT_SECONDS}s for $${WG_ADDR}"
        waited=0
        while ! ip -4 addr show 2>/dev/null | grep -q "inet $${WG_ADDR}/"; do
          if [ "$$waited" -ge "$${WAIT_SECONDS}" ]; then
            echo "bootstrap: FAILED — $${WG_ADDR} never appeared." >&2
            echo "  postgres and redis publish on it and cannot start without it." >&2
            echo "  On this box:  systemctl status wg-quick@wg0" >&2
            exit 1
          fi
          sleep 2; waited=$$((waited + 2))
        done
        echo "bootstrap: $${WG_ADDR} is up (after $${waited}s)"

        apk add --no-cache e2fsprogs util-linux >/dev/null 2>&1 \
          || { echo "bootstrap: could not install e2fsprogs/util-linux (no egress?)" >&2; exit 1; }

        if [ ! -f "$$IMG" ]; then
          echo "bootstrap: creating $${PGDATA_SIZE} image"
          fallocate -l "$${PGDATA_SIZE}" "$$IMG" 2>/dev/null \
            || dd if=/dev/zero of="$$IMG" bs=1M \
                 count=$$(( $$(echo "$${PGDATA_SIZE}" | tr -dc 0-9) * 1024 )) status=none
        else
          echo "bootstrap: image exists"
        fi

        # NEVER re-mkfs an image that already carries a filesystem. That single
        # guard is the difference between re-running this and erasing the
        # database — and re-running is exactly what people do.
        if blkid "$$IMG" >/dev/null 2>&1; then
          echo "bootstrap: filesystem already present — not touching it"
        else
          # -m 1: ext4 reserves 5% for root BY DEFAULT and postgres is not root,
          # so a 10G volume would hand it 9.5G and refuse the rest with a
          # confusing ENOSPC while df still showed free space.
          mkfs.ext4 -q -m 1 -F "$$IMG"
          echo "bootstrap: mkfs.ext4 done (1% reserve, not the 5% default)"
        fi
        echo "bootstrap: ready"

  postgres:
    # Plain postgres: this app's models.py has no vector columns, so the
    # pgvector image the sibling deployment needs would be dead weight here.
    image: postgres:18-alpine
    container_name: skillswap-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    # /dev/shm is a tmpfs and its pages COUNT AGAINST the 256m limit below, so
    # this is not free headroom. 64m is the Docker default and is enough
    # precisely because parallel query is off (see max_parallel_* in command).
    shm_size: 64m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skillswapaidb}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      # PG18 images keep data in a major-version subdir and REQUIRE the mount at
      # /var/lib/postgresql (not the legacy .../data), so pg_upgrade --link can
      # work without crossing a mount boundary (docker-library/postgres#1259).
      # PGDATA then lands at /var/lib/postgresql/18/docker inside this volume.
      #
      # A HAPPY CONSEQUENCE OF THAT LAYOUT: the volume below is a freshly
      # formatted ext4 filesystem, so its root contains `lost+found`. Mounted at
      # /var/lib/postgresql the entrypoint never looks there — it checks PGDATA,
      # two levels down. On PG<=17, where the mount goes AT the data directory,
      # that same lost+found makes initdb refuse with "directory not empty".
      - pgdata:/var/lib/postgresql
    command:
      - postgres
      # ── sized for 1 CPU / 256M. The inline ${...:-} fallbacks ARE the
      #    256M profile; deploy/postgres/pg-tuning.env is the single file to
      #    edit on a resize (data-deploy.sh sources it). ──
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-64MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-192MB}
      - -c
      - work_mem=${PG_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-32MB}
      # Parallel query OFF. A parallel worker is another backend process inside
      # a 256M cgroup and it uses /dev/shm, which is charged to the same limit —
      # so the OOM killer arrives during exactly the query that needed help.
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_workers=0
      - -c
      - max_worker_processes=4
      - -c
      - random_page_cost=1.1          # NVMe/SSD — random ≈ sequential cost
      - -c
      - wal_compression=on
      # 512MB, not the 1GB default: checkpoints spread WAL up to ~2-3x
      # max_wal_size on disk, and the disk here is 10G TOTAL.
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-512MB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-128MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=on
      - -c
      - timezone=UTC
      - -c
      - logging_collector=off         # stderr → docker logs, not files on the 10G disk
      - -c
      - log_destination=stderr
      - -c
      - log_line_prefix=%m [%p] %q%u@%d %a %e
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION:-200}
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
    ports:
      - "${WG_ADDR:-10.77.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    networks: [skillswap-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${PG_CPUS:-1.0}
    mem_limit: ${PG_MEM_LIMIT:-256m}
    logging: &logs
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: skillswap-redis
    restart: unless-stopped
    # The sh guard REFUSES to start without a password (one clear log line and a
    # restart loop on this container alone) instead of silently running
    # authless. A soft ${VAR:-} interpolation keeps every other compose command
    # working on a machine that has not set it yet.
    #
    # volatile-lru: every key this app writes carries a TTL (the AI response
    # cache, rate-limit windows, distributed locks), so eviction under pressure
    # stays inside expiring keys.
    command:
      - sh
      - -c
      - >
        test -n "$$REDIS_PASSWORD" ||
        { echo 'redis: REDIS_PASSWORD not set in .env — refusing to start authless' >&2; exit 1; };
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes --appendfsync everysec
        --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - skillswap-redis-data:/data
    ports:
      # 6380 on the host: 6379 there is Nova Flow's native Redis.
      - "${WG_ADDR:-10.77.0.1}:${REDIS_HOST_PORT:-6380}:6379"
    networks: [skillswap-data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 3
    # 640m against a 512mb maxmemory — 1.25x, headroom for the AOF-rewrite
    # fork's copy-on-write pages. Sizing mem_limit AT maxmemory means the OOM
    # killer wins the race with the rewrite.
    mem_limit: ${REDIS_MEM_LIMIT:-640m}
    logging: *logs

volumes:
  # ── THE 10 GB CEILING, DECLARED RATHER THAN PROVISIONED ───────────────────
  #
  # Docker cannot size-limit a volume: there is no `--storage-opt size=` for
  # volumes, and the one that exists applies to a container's writable layer and
  # needs an xfs+pquota backend. So "10 GB for PostgreSQL" written as an ordinary
  # volume or a bind onto the root filesystem is not a limit at all, it is a
  # hope — and this box also holds Nova Flow's production Redis, so a runaway
  # table here would be an outage over there.
  #
  # A filesystem in a FILE is a real ceiling with no repartitioning. Docker's
  # local driver hands these options straight to mount(8), so `o: loop` sets up
  # and tears down the loop device automatically with the volume's lifecycle —
  # no losetup, no fstab, nothing to remember. Postgres hits ENOSPC at exactly
  # PGDATA_SIZE, which is loud, local and survivable.
  #
  # The `bootstrap` service above creates and formats the image before anything
  # mounts it. Mounting a device that does not exist yet is the failure this
  # ordering prevents.
  #
  # NOTE: an overlay file CANNOT remove these driver_opts — compose MERGES a
  # named volume's definition rather than replacing it (measured). That is why
  # docker-compose.dev.yml points at a different volume entirely instead of
  # trying to override this one.
  pgdata:
    driver: local
    driver_opts:
      type: ext4
      o: loop
      device: ${PGDATA_IMAGE:-/srv/skillswap/pgdata.img}
  skillswap-redis-data:

networks:
  skillswap-data:
    driver: bridge
